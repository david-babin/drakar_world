<!doctype html>
<html lang="en">
<head>

<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&family=IBM+Plex+Mono:wght@300;400&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #07090c; --ink: #c9c2b2; --dim: #6c6a60; --faint: #3a3d3f; --line: #1d2429; --accent: #d9a85c;
  --mono: 'IBM Plex Mono', ui-monospace, monospace; --serif: 'Cormorant Garamond', Georgia, serif;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; background: var(--bg); color: var(--ink); overflow: hidden; }
body { font-family: var(--mono); font-weight: 300; font-size: 11px; letter-spacing: .02em; }
canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
#globe { cursor: grab; touch-action: none; } #globe.drag { cursor: grabbing; }
html, body { overscroll-behavior: none; }
#over { pointer-events: none; }
#veil { position: fixed; inset: 0; background: var(--bg); pointer-events: none; transition: opacity 2.4s ease; }
.hud { position: fixed; pointer-events: none; color: var(--dim); line-height: 1.7; }
.hud b { color: var(--ink); font-weight: 400; }
.hud i { color: var(--accent); font-style: normal; }
.hud i.dn { color: #7fa3c4; }
#brand { left: 20px; bottom: 16px; font-family: var(--serif); font-size: 28px; letter-spacing: .14em; color: var(--ink); font-weight: 400; }
#brand small { display: block; font-family: var(--mono); font-size: 10px; letter-spacing: .18em; color: var(--dim); margin-top: -2px; }
#lang { pointer-events: auto; margin-left: 10px; letter-spacing: .12em; }
#lang a { color: var(--faint); cursor: pointer; text-decoration: none; transition: color .3s; }
#lang a:hover { color: var(--dim); } #lang a.on { color: var(--dim); }
#era { left: 20px; top: 16px; font-family: var(--serif); font-size: 15px; letter-spacing: .08em; color: var(--ink); }
/* the witness: code name, index, climate — one clickable block that invites with a composited halo (opacity + transform) */
#witness { position: fixed; right: 20px; top: 16px; text-align: right; line-height: 1.7; color: var(--dim); cursor: pointer; user-select: none; padding: 4px 0 4px 24px; z-index: 2; }
#witness b { color: var(--ink); font-weight: 400; } #witness i { color: var(--accent); font-style: normal; } #witness i.dn { color: #7fa3c4; }
#witness .sg { letter-spacing: .14em; color: var(--dim); transition: color .4s; }
#witness:hover .sg, #witness.invite .sg { color: var(--ink); }
#witness::before { content: ''; position: absolute; inset: -22px -40px -18px -30px; border-radius: 50%; z-index: -1; pointer-events: none;
  background: radial-gradient(ellipse at center, rgba(217,168,92,.30) 0%, rgba(217,168,92,.10) 40%, rgba(217,168,92,0) 70%);
  opacity: 0; transform: scale(.75); will-change: opacity, transform; }
#witness.invite::before { animation: bloom 4.2s ease-in-out infinite; }
#witness::after { content: ''; position: absolute; right: 0; bottom: -2px; height: 1px; width: 0; background: var(--accent); opacity: 0; }
#witness.invite::after { animation: cue 4.2s ease-in-out infinite; }
@keyframes bloom { 0%, 100% { opacity: 0; transform: scale(.75); } 50% { opacity: 1; transform: scale(1); } }
@keyframes cue { 0%, 100% { width: 0; opacity: 0; } 50% { width: 100%; opacity: .8; } }
@media (prefers-reduced-motion: reduce) { #witness.invite::before, #witness.invite::after { animation: none; } #witness.invite::before { opacity: .6; transform: none; } }
#whisper { position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%); text-align: center; pointer-events: none; opacity: 0; transition: opacity .9s ease; max-width: 520px; padding: 0 24px; z-index: 3; }
#whisper.on { opacity: 1; transition: opacity .35s ease; }
#whisper::before { content: ''; position: absolute; inset: -60px -120px; background: radial-gradient(ellipse at center, rgba(7,9,12,.82) 0%, rgba(7,9,12,.55) 45%, rgba(7,9,12,0) 72%); z-index: -1; }
#whisper p { font-family: var(--serif); font-size: 22px; line-height: 1.35; color: var(--ink); letter-spacing: .02em; text-shadow: 0 0 24px rgba(7,9,12,.9), 0 0 6px rgba(7,9,12,1); }
#whisper small { display: block; margin-top: 14px; font-family: var(--mono); font-size: 10px; letter-spacing: .14em; color: var(--dim); }
#whisper b { color: var(--accent); font-weight: 400; }
#chron { right: 20px; bottom: 16px; width: 260px; max-height: 26vh; overflow: hidden; text-align: right; opacity: .55;
  -webkit-mask-image: linear-gradient(to bottom, transparent, #000 35%); mask-image: linear-gradient(to bottom, transparent, #000 35%); }
#chron div { padding: 1px 0; opacity: .85; }
#chron div.new { animation: rise 1.4s ease both; }
#chron em { color: var(--faint); font-style: normal; margin-left: 8px; }
#chron span.yr { color: var(--dim); margin-right: 8px; }
@keyframes rise { from { opacity: 0; transform: translateY(6px); } to { opacity: .85; transform: none; } }
#status { left: 20px; bottom: 76px; }
#status .bar { display: inline-block; width: 120px; height: 2px; background: var(--line); vertical-align: middle; margin-left: 8px; }
#status .bar i { display: block; height: 100%; background: var(--accent); width: 0; transition: width .12s linear; }
#tip { position: fixed; pointer-events: none; padding: 6px 9px; background: rgba(7,9,12,.92); border: 1px solid var(--line); color: var(--ink); display: none; white-space: nowrap; }
#tip small { color: var(--dim); display: block; }
@media (max-width: 720px) { #chron { display: none; } #witness { padding-left: 12px; } #brand { font-size: 22px; } body { font-size: 10px; } #whisper p { font-size: 18px; } }
</style>
</head>
<body>
<canvas id="globe"></canvas>
<canvas id="over"></canvas>
<div id="veil"></div>

<div id="era" class="hud">—</div>
<div id="witness"><div class="sg"></div><div class="mk"></div></div>
<div id="whisper"><p></p><small></small></div>
<div id="status" class="hud"></div>
<div id="chron" class="hud"></div>
<div id="brand" class="hud">drakar<small>.tech<span id="lang"></span></small></div>
<div id="tip"></div>

<script type="module">
import * as S from './sim.js';
const { W, H, RX, RY, RW, RH, STEPS, ROMAN } = S;
const DEG = Math.PI / 180;
const $ = id => document.getElementById(id);

// ---------- language ----------
// UI strings live in locales/<lang>.json and are injected by the server (or by build-demo.mjs).
// Choice: ?lang= → saved choice → first supported language in the browser preferences → English.
const LOCALES = /*__LOCALES__*/null || {};
const SUPPORTED = Object.keys(LOCALES).length ? Object.keys(LOCALES) : ['en'];
function pickLang() {
  const q = new URLSearchParams(location.search).get('lang');
  if (q && LOCALES[q]) return q;
  try { const s = localStorage.getItem('drakar.lang'); if (s && LOCALES[s]) return s; } catch {}
  for (const l of navigator.languages || [navigator.language || 'en']) { const base = String(l).slice(0, 2).toLowerCase(); if (LOCALES[base]) return base; }
  return LOCALES.en ? 'en' : SUPPORTED[0];
}
let lang = pickLang();
const L = () => LOCALES[lang] || LOCALES.en || {};
const fill = (str, vars = {}) => String(str ?? '').replace(/\{(\w+)\}/g, (_, k) => vars[k] ?? '');
const t = (key, vars) => fill(key.split('.').reduce((o, k) => o?.[k], L()) ?? key, vars);
const fmt = n => n.toLocaleString(L().numberLocale || 'en-GB');
const lineageName = id => L().lineages?.[id] ?? world?.lineages[id]?.name ?? '?';
function applyLang() {
  document.documentElement.lang = lang;
  document.querySelector('meta[name="description"]').content = t('meta.description');
  $('lang').innerHTML = SUPPORTED.length > 1 ? SUPPORTED.map(l => `<a data-l="${l}" class="${l === lang ? 'on' : ''}">${l}</a>`).join(' ') : '';
  if (world) { renderChronicle(); hud(); }
}
$('lang').addEventListener('click', e => {
  const l = e.target.dataset?.l; if (!l || l === lang) return;
  lang = l; try { localStorage.setItem('drakar.lang', l); } catch {}
  applyLang();
});

// ---------- visitor identity ----------
function sigil() {
  try { const s = localStorage.getItem('drakar.sigil'); if (s) return s; } catch {}
  const src = [navigator.hardwareConcurrency, navigator.deviceMemory, screen.width, screen.height, screen.colorDepth,
    Intl.DateTimeFormat().resolvedOptions().timeZone, navigator.language, navigator.platform, Math.random()].join('|');
  const h = S.hashStr(src).toString(36).toUpperCase().padStart(8, '0');
  const sg = `${h.slice(0, 4)}-${h.slice(4, 8)}`;
  try { localStorage.setItem('drakar.sigil', sg); } catch {}
  return sg;
}
const ME = sigil();

// ---------- machine telemetry ----------
const tele = { cores: navigator.hardwareConcurrency || 0, mem: navigator.deviceMemory || 0, batt: null, net: null, fps: 0, dps: 0, units: 0, ticks: 0, decisions: 0 };
(async () => {
  try { const b = await navigator.getBattery?.(); if (b) { const u = () => tele.batt = { level: b.level, charging: b.charging }; u(); b.onlevelchange = b.onchargingchange = u; } } catch {}
  try { const n = navigator.connection; if (n) { const u = () => tele.net = { type: n.effectiveType, rtt: n.rtt }; u(); n.onchange = u; } } catch {}
})();

// ---------- state ----------
const DEMO = !!window.DRAKAR_DATA || !location.protocol.startsWith('http') || new URLSearchParams(location.search).has('demo');
let world = null, T = null, online = 1, lease = null, link = 'ok';
const peers = new Map();            // sigil → { region, step, agents: [[id,x,y,lin,pop]], at }
const PEER_TTL = 6000;
const chron = $('chron');

// ---------- WebGL globe ----------
// Everything geographic is drawn by the GPU in one pass: base (terrain classes), land (Natural Earth rings
// filled by stencil parity into a texture, once), coasts and contour lines (segments extruded to a width in
// the vertex shader). The 2D canvas only carries life.
const gcv = $('globe'), ocv = $('over'), octx = ocv.getContext('2d');
const gl = gcv.getContext('webgl', { antialias: true, alpha: false, stencil: true, premultipliedAlpha: false });
function shader(type, src) { const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s); if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s)); return s; }
function program(vs, fs) { const p = gl.createProgram(); gl.attachShader(p, shader(gl.VERTEX_SHADER, vs)); gl.attachShader(p, shader(gl.FRAGMENT_SHADER, fs)); gl.linkProgram(p); if (!gl.getProgramParameter(p, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(p)); const u = {}, a = {}; for (let i = 0; i < gl.getProgramParameter(p, gl.ACTIVE_UNIFORMS); i++) { const n = gl.getActiveUniform(p, i).name; u[n] = gl.getUniformLocation(p, n); } for (let i = 0; i < gl.getProgramParameter(p, gl.ACTIVE_ATTRIBUTES); i++) { const n = gl.getActiveAttrib(p, i).name; a[n] = gl.getAttribLocation(p, n); } return { p, u, a }; }
const quad = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, quad); gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 1, -1, -1, 1, 1, 1]), gl.STATIC_DRAW);

// --- 1. the globe: disc, base, land, graticule, shading
const GLOBE = program(`attribute vec2 p; varying vec2 v; void main(){ v = p; gl_Position = vec4(p, 0., 1.); }`, `
precision highp float;
varying vec2 v;
uniform vec2 res; uniform vec2 center; uniform float R; uniform float lon0, lat0; uniform float climate;
uniform sampler2D base; uniform sampler2D mask;
const float PI = 3.14159265;
vec3 landCol(float t) {
  if (t < 3.5) return vec3(0.118, 0.145, 0.157);     // plain (or unknown class at the edge)
  if (t < 4.5) return vec3(0.150, 0.178, 0.185);     // hills
  if (t < 5.5) return vec3(0.195, 0.222, 0.228);     // mountain
  return vec3(0.135, 0.165, 0.19);                   // ice
}
void main() {
  vec2 px = v * res * .5;
  vec2 q = (px - center) / R;
  float d2 = dot(q, q);
  vec3 bg = vec3(0.027, 0.035, 0.047);
  float tint = climate;
  vec3 glowC = tint >= 0. ? vec3(0.85, 0.66, 0.36) : vec3(0.50, 0.64, 0.77);
  if (d2 > 1.0) { float d = sqrt(d2); float halo = exp(-(d - 1.0) * 14.0) * (0.10 + 0.10 * abs(tint)); gl_FragColor = vec4(bg + glowC * halo, 1.); return; }
  float z = sqrt(1.0 - d2);
  float cl0 = cos(lat0), sl0 = sin(lat0);
  float lat = asin(clamp(q.y * cl0 + z * sl0, -1., 1.));
  float lon = lon0 + atan(q.x, cl0 * z - q.y * sl0);
  vec2 uv = vec2(mod(lon / (2. * PI) + .5, 1.), 0.5 - lat / PI);
  float fv = floor(texture2D(base, uv).r * 255. + .5);
  float t = floor(fv / 32.), lvl = mod(fv, 32.) / 2.;
  float land = texture2D(mask, uv).r;                 // vector land, edges smoothed by filtering
  vec3 sea = (t >= 1.5 || t == 1.) ? vec3(0.071, 0.118, 0.157) : vec3(0.047, 0.078, 0.106);   // continental shelf
  vec3 c = mix(sea, landCol(t + 1.) * (1.0 + lvl * 0.035), land);
  if (t > 4.5 && land > 0.5) c = landCol(6.);        // ice
  float gla = abs(fract(lat / PI * 12. + .5) - .5), glo = abs(fract(lon / PI * 12. + .5) - .5);
  float gw = 0.012 * (1.0 + 3.0 * (1.0 - z));
  float grat = (1.0 - smoothstep(0.0, gw, gla)) + (1.0 - smoothstep(0.0, gw, glo));
  c += vec3(0.79, 0.76, 0.70) * grat * 0.045;
  float shade = 0.55 + 0.45 * pow(z, 0.6);
  c *= shade;
  c += glowC * (0.05 * abs(tint)) * (1.0 - z);
  float aa = smoothstep(1.0, 1.0 - 2.0 / R, d2);
  gl_FragColor = vec4(mix(bg, c, aa), 1.);
}`);
const texBase = gl.createTexture(), texMask = gl.createTexture();
function texParams(filter, wrapS) { gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, filter); gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, filter); gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, wrapS); gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE); }
gl.pixelStorei(gl.UNPACK_COLORSPACE_CONVERSION_WEBGL, gl.NONE);
function uploadBase(img) { gl.bindTexture(gl.TEXTURE_2D, texBase); texParams(gl.NEAREST, gl.CLAMP_TO_EDGE); gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, img); }

// --- 2. land: stencil parity over the rings, equirectangular, into a texture
const MASKW = Math.min(4096, gl.getParameter(gl.MAX_TEXTURE_SIZE)), MASKH = MASKW / 2;
const QUADP = program(`attribute vec2 p; void main(){ gl_Position = vec4(p, 0., 1.); }`, `precision mediump float; void main(){ gl_FragColor = vec4(1.); }`);
const FILL = program(`attribute vec2 ll; uniform float off; void main(){ gl_Position = vec4((ll.x + off) / 180., ll.y / 90., 0., 1.); }`, `precision mediump float; void main(){ gl_FragColor = vec4(1.); }`);
function buildMask(rings) {
  // fan triangles from each ring's first point; stencil parity does the rest (holes included)
  let tri = 0; for (const r of rings) tri += Math.max(0, r.length / 2 - 2);
  const data = new Float32Array(tri * 6); let o = 0;
  for (const r of rings) { const ax = r[0], ay = r[1]; for (let i = 1; i + 1 < r.length / 2; i++) { data[o++] = ax; data[o++] = ay; data[o++] = r[2 * i]; data[o++] = r[2 * i + 1]; data[o++] = r[2 * i + 2]; data[o++] = r[2 * i + 3]; } }
  const vb = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, vb); gl.bufferData(gl.ARRAY_BUFFER, data, gl.STATIC_DRAW);
  gl.bindTexture(gl.TEXTURE_2D, texMask); texParams(gl.LINEAR, gl.REPEAT);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, MASKW, MASKH, 0, gl.RGBA, gl.UNSIGNED_BYTE, null);
  const fb = gl.createFramebuffer(); gl.bindFramebuffer(gl.FRAMEBUFFER, fb);
  gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, texMask, 0);
  const rb = gl.createRenderbuffer(); gl.bindRenderbuffer(gl.RENDERBUFFER, rb); gl.renderbufferStorage(gl.RENDERBUFFER, gl.STENCIL_INDEX8, MASKW, MASKH);
  gl.framebufferRenderbuffer(gl.FRAMEBUFFER, gl.STENCIL_ATTACHMENT, gl.RENDERBUFFER, rb);
  gl.viewport(0, 0, MASKW, MASKH); gl.clearColor(0, 0, 0, 1); gl.clearStencil(0); gl.clear(gl.COLOR_BUFFER_BIT | gl.STENCIL_BUFFER_BIT);
  gl.useProgram(FILL.p); gl.enableVertexAttribArray(FILL.a.ll); gl.vertexAttribPointer(FILL.a.ll, 2, gl.FLOAT, false, 0, 0);
  gl.enable(gl.STENCIL_TEST); gl.colorMask(false, false, false, false);
  gl.stencilFunc(gl.ALWAYS, 0, 0xff); gl.stencilOp(gl.KEEP, gl.KEEP, gl.INVERT);
  for (const off of [0, -360]) { gl.uniform1f(FILL.u.off, off); gl.drawArrays(gl.TRIANGLES, 0, tri * 3); }   // rings unwrapped past 180° come back on the left
  gl.colorMask(true, true, true, true); gl.stencilFunc(gl.EQUAL, 1, 0xff); gl.stencilOp(gl.KEEP, gl.KEEP, gl.KEEP);
  gl.disableVertexAttribArray(FILL.a.ll);
  gl.useProgram(QUADP.p); gl.bindBuffer(gl.ARRAY_BUFFER, quad); gl.enableVertexAttribArray(QUADP.a.p); gl.vertexAttribPointer(QUADP.a.p, 2, gl.FLOAT, false, 0, 0);
  gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);                 // white wherever parity is odd: the land
  gl.disableVertexAttribArray(QUADP.a.p);
  gl.disable(gl.STENCIL_TEST);
  gl.bindFramebuffer(gl.FRAMEBUFFER, null); gl.deleteBuffer(vb); gl.deleteRenderbuffer(rb); gl.deleteFramebuffer(fb);
}

// --- 3. lines: each segment extruded into a quad in the vertex shader
const LINE = program(`
attribute vec3 a0, a1; attribute vec2 corner;
uniform mat3 M; uniform vec2 res, center; uniform float R, hw;
varying float vz;
void main() {
  vec3 q0 = M * a0, q1 = M * a1;
  vec2 s0 = center + R * vec2(q0.x, -q0.y), s1 = center + R * vec2(q1.x, -q1.y);
  vec2 d = s1 - s0; float L = length(d); d = L > 0.0 ? d / L : vec2(1., 0.);
  vec2 n = vec2(-d.y, d.x);
  vec2 p = (corner.x < 0.5 ? s0 : s1) + n * corner.y * hw;
  vz = min(q0.z, q1.z);
  gl_Position = vec4(p.x / res.x * 2. - 1., 1. - p.y / res.y * 2., 0., 1.);
}`, `precision mediump float; varying float vz; uniform vec4 color; void main(){ if (vz < 0.0) discard; gl_FragColor = vec4(color.rgb, color.a * smoothstep(0.0, 0.12, vz)); }`);
// flat geometry: 4 vertices per segment (a0, a1, corner), 16-bit indices in chunks of 16,000 segments
const CHUNK = 16000;
const lineSets = [];                       // { chunks: [{ vb, ib, n }], color, width }
function addLines(lines, color, width) {
  const segs = [];
  for (const L of lines) for (let j = 0; j + 1 < L.n; j++) segs.push(L.x[j], L.y[j], L.z[j], L.x[j + 1], L.y[j + 1], L.z[j + 1]);
  const total = segs.length / 6, chunks = [];
  for (let c0 = 0; c0 < total; c0 += CHUNK) {
    const n = Math.min(CHUNK, total - c0), v = new Float32Array(n * 4 * 8), ix = new Uint16Array(n * 6);
    for (let i = 0; i < n; i++) {
      const s = (c0 + i) * 6;
      for (let k = 0; k < 4; k++) { const o = (i * 4 + k) * 8; v[o] = segs[s]; v[o + 1] = segs[s + 1]; v[o + 2] = segs[s + 2]; v[o + 3] = segs[s + 3]; v[o + 4] = segs[s + 4]; v[o + 5] = segs[s + 5]; v[o + 6] = k >> 1; v[o + 7] = (k & 1) ? 1 : -1; }
      const b = i * 4, q = i * 6; ix[q] = b; ix[q + 1] = b + 1; ix[q + 2] = b + 2; ix[q + 3] = b + 2; ix[q + 4] = b + 1; ix[q + 5] = b + 3;
    }
    const vb = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, vb); gl.bufferData(gl.ARRAY_BUFFER, v, gl.STATIC_DRAW);
    const ib = gl.createBuffer(); gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, ib); gl.bufferData(gl.ELEMENT_ARRAY_BUFFER, ix, gl.STATIC_DRAW);
    chunks.push({ vb, ib, n });
  }
  lineSets.push({ chunks, color, width });
}
function drawLines(M, R, cxd, cyd, w, h) {
  if (!lineSets.length) return;
  gl.useProgram(LINE.p); gl.enable(gl.BLEND); gl.blendFunc(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA);
  gl.uniformMatrix3fv(LINE.u.M, false, M); gl.uniform2f(LINE.u.res, w, h); gl.uniform2f(LINE.u.center, cxd, cyd); gl.uniform1f(LINE.u.R, R);
  gl.enableVertexAttribArray(LINE.a.a0); gl.enableVertexAttribArray(LINE.a.a1); gl.enableVertexAttribArray(LINE.a.corner);
  for (const s of lineSets) {
    gl.uniform4fv(LINE.u.color, s.color); gl.uniform1f(LINE.u.hw, s.width * dpr / 2);
    for (const c of s.chunks) {
      gl.bindBuffer(gl.ARRAY_BUFFER, c.vb);
      gl.vertexAttribPointer(LINE.a.a0, 3, gl.FLOAT, false, 32, 0); gl.vertexAttribPointer(LINE.a.a1, 3, gl.FLOAT, false, 32, 12); gl.vertexAttribPointer(LINE.a.corner, 2, gl.FLOAT, false, 32, 24);
      gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, c.ib);
      gl.drawElements(gl.TRIANGLES, c.n * 6, gl.UNSIGNED_SHORT, 0);

    tele.cores ? t('machine.cpu', { n: tele.cores }) : null, tele.mem ? t('machine.mem', { n: tele.mem }) : null,
    tele.dps ? t('machine.dps', { n: fmt(tele.dps) }) : null, lease ? t('machine.region', { r: ROMAN[lease.unit.region] }) : null,
    online > 1 ? t('machine.online', { n: online }) : null,

  whisper.classList.add('on'); clearTimeout(whisperTimer); whisperTimer = setTimeout(() => whisper.classList.remove('on'), 3600);
});

// ---------- chronicle ----------
// Entries are structured (kind + parameters) and rendered in the current language. Entries written before
// this format only carry a text: it is shown as is when it cannot be rebuilt.
// Legacy entries: their frozen text is matched against every locale's templates for that kind, which recovers
// the parameters (names, lineages, sea or land, regime) without hard-coding any language here.
const legacyCache = new Map();
function templateRegex(tpl) {
  const keys = [];
  const src = String(tpl).replace(/[.*+?^$()|[\]\\]/g, '\\$&').replace(/\{(\w+)\}/g, (_, k) => { keys.push(k); return '(.+?)'; });
  return { re: new RegExp('^' + src + '$'), keys };
}
function parseLegacy(e) {
  if (legacyCache.has(e.text)) return legacyCache.get(e.text);
  const variants = { found: ['found'], raid: ['raid'], route: ['route', 'seaRoute'], freeze: ['freezeOne', 'freezeMany'], wind: ['wind.plenty', 'wind.scarcity', 'wind.ordinary'] }[e.kind] || [];
  let out = null;
  for (const loc of Object.values(LOCALES)) {
    for (const v of variants) {
      const tpl = v.split('.').reduce((o, k) => o?.[k], loc.chronicle); if (!tpl) continue;
      const { re, keys } = templateRegex(tpl), m = String(e.text).match(re); if (!m) continue;
      const got = Object.fromEntries(keys.map((k, i) => [k, m[i + 1]]));
      const linId = name => (loc.lineages || []).indexOf(name);
      out = {};
      if (got.name) out.name = got.name;
      if (got.from) { out.from = got.from; out.to = got.to; out.sea = v === 'seaRoute' ? 1 : 0; }
      if (got.vs != null && linId(got.vs) >= 0) out.vs = linId(got.vs);
      if (got.days) out.days = +got.days;
      if (v.startsWith('wind.')) out.regime = v.slice(5);
      break;
    }
    if (out) break;
  }
  legacyCache.set(e.text, out);
  return out;
}
// settlement areas: connected groups of one lineage (≤ 3 cells apart), with their pop-weighted centre.
// Recomputed only when the settled set changes (the world, not the animation, drives it).
let urbanKey = null, urbanCache = [];
function urbanAreas(agents) {
  const key = agents.length + ':' + (agents.length ? agents[0].id + ':' + agents[agents.length - 1].id : '') + ':' + world.tick;
  if (key === urbanKey) return urbanCache;
  const LINK = 3, cell = new Map(), seen = new Set(), out = [];
  for (const a of agents) { const k = ((a.x / LINK) | 0) + ',' + ((a.y / LINK) | 0); (cell.get(k) || cell.set(k, []).get(k)).push(a); }
  const GX = Math.ceil(S.W / LINK);
  for (const a0 of agents) {
    if (seen.has(a0)) continue;
    const members = [], stack = [a0]; seen.add(a0);
    while (stack.length) {
      const a = stack.pop(); members.push(a);
      const gx = (a.x / LINK) | 0, gy = (a.y / LINK) | 0;
      for (let j = -1; j <= 1; j++) for (let i = -1; i <= 1; i++) {
        for (const b of cell.get(((gx + i + GX) % GX) + ',' + (gy + j)) || []) {
          if (seen.has(b) || b.lin !== a0.lin) continue;
          let dx = Math.abs(b.x - a.x); dx = Math.min(dx, S.W - dx);
          if (dx <= LINK && Math.abs(b.y - a.y) <= LINK) { seen.add(b); stack.push(b); }
        }
      }
    }
    let pop = 0, core = members[0], sx = 0, sy = 0;
    for (const m of members) { pop += m.pop; if (m.pop > core.pop) core = m; }
    for (const m of members) { let dx = m.x - core.x; if (dx > S.W / 2) dx -= S.W; else if (dx < -S.W / 2) dx += S.W; sx += dx * m.pop; sy += (m.y - core.y) * m.pop; }
    out.push({ lin: a0.lin, pop, members, core, x: core.x + sx / pop, y: core.y + sy / pop });
  }

}
function entryText(e) {
  let p = e.p || {}; const C = 'chronicle.';
  const legacy = e.text && !Object.keys(p).length;
  if (legacy) p = parseLegacy(e) || {};
  const lin = e.lin != null ? lineageName(e.lin) : '';
  const where = e.x != null ? ROMAN[S.regionOf(e.x, e.y)] : '';
  switch (e.kind) {
    case 'genesis': return t(C + 'genesis', { n: p.n || 16 });
    case 'found': return p.name ? t(C + 'found', { name: p.name, lin }) : e.text || '';
    case 'raid': return p.vs != null ? t(C + 'raid', { lin, vs: lineageName(p.vs), where }) : e.text || '';
    case 'voyage': return t(C + 'voyage', { lin, where });
    case 'route': return p.from ? t(C + (p.sea ? 'seaRoute' : 'route'), { from: p.from, to: p.to }) : e.text || '';
    case 'extinction': return t(C + 'extinction', { lin });
    case 'freeze': { const days = p.days || +(String(e.text || '').match(/\d+/) || [1])[0]; return t(C + (days > 1 ? 'freezeMany' : 'freezeOne'), { days }); }
    case 'wind': return p.regime ? t(C + 'wind.' + p.regime) : e.text || '';
    case 'crossing': return t(C + 'crossing', { lin, where });
    case 'assimilate': return t(C + 'assimilate', { lin, vs: lineageName(p.vs), where });
    case 'revolt': return t(C + 'revolt', { lin, vs: lineageName(p.vs), where });
    case 'takeover': return t(C + 'takeover', { name: p.name, lin, vs: lineageName(p.vs) });
    case 'abandon': return t(C + 'abandon', { name: p.name });
    case 'rebirth': return t(C + 'rebirth', { lin, where });

}
function chronLine(e, isNew) {
  const d = document.createElement('div'); if (isNew) d.className = 'new';
  const yr = document.createElement('span'); yr.className = 'yr'; yr.textContent = t('year', { n: fmt(Math.floor(e.tick / 4)) });
  const who = document.createElement('em'); who.textContent = e.sigil === ME ? '◆' : e.sigil;
  d.append(yr, entryText(e), who);
  return d;
}
function addChron(e, isNew) {
  if (isNew && world) { world.chronicle.push(e); if (world.chronicle.length > 60) world.chronicle.shift(); }   // the "memory" rings read world.chronicle
  chron.appendChild(chronLine(e, isNew)); while (chron.children.length > 14) chron.firstChild.remove();
}
function renderChronicle() { chron.innerHTML = ''; for (const e of world.chronicle.slice(-14)) chron.appendChild(chronLine(e, false)); }
function setWorld(w) {
  const first = !world;
  world = w;
  if (first) { worldAt = performance.now(); renderChronicle(); $('veil').style.opacity = 0; }
}
applyLang();

// ---------- compute loop ----------
const budgetMs = () => Math.max(3, Math.min(14, 2 + (tele.cores || 2) * 1.5));
// The unit being computed. It can be aborted at any time (connection lost, lease expired while hidden):
// the promise then resolves at once, even if the tab is hidden and no animation frame will come.
let run = null;
function abortUnit() { if (run) { const r = run; run = null; r.aborted = true; r.resolve(); } lease = null; }
async function runUnit(unit, verify, onDone, onProgress) {
  const gen = S.simulateUnitGen(T, unit);
  const L = { unit, agents: unit.agents, step: 0, t0: performance.now(), verify };
  lease = L;
  let lastDec = 0, lastT = performance.now(), lastProg = 0;
  await new Promise(resolve => {
    const me = run = { resolve, aborted: false, startedAt: Date.now() };
    const tickFrame = () => {
      if (me.aborted) return;
      const start = performance.now();
      let r;
      do {
        r = gen.next();
        if (r.done) break;
        L.agents = r.value.agents; L.step = r.value.step + 1;
      } while (performance.now() - start < budgetMs() && L.step % 2 !== 0);
      const now = performance.now();
      if (r.value?.decisions != null && now - lastT > 400) { tele.dps = Math.round((r.value.decisions - lastDec) / ((now - lastT) / 1000)); lastDec = r.value.decisions; lastT = now; }
      if (onProgress && !r.done && now - lastProg > 500) { lastProg = now; onProgress(L.step, L.agents); }
      if (r.done) { if (run === me) run = null; onDone(r.value, performance.now() - L.t0); resolve(); } else requestAnimationFrame(tickFrame);
    };
    requestAnimationFrame(tickFrame);
  });
}
const sleep = ms => new Promise(r => setTimeout(r, ms));

// differential progress: the first frame is complete, the following ones only carry what changed
function progressSender(region) {
  let prev = null;
  return (step, agents) => {
    const now = new Map(); for (const a of agents) if (a.pop > 0) now.set(a.id, [a.id, a.x, a.y, a.lin, a.pop]);
    if (!prev) { prev = now; return { t: 'progress', region, step, full: 1, agents: [...now.values()] }; }
    const changed = [], gone = [];
    for (const [id, v] of now) { const p = prev.get(id); if (!p || p[1] !== v[1] || p[2] !== v[2] || p[4] !== v[4]) changed.push(v); }
    for (const id of prev.keys()) if (!now.has(id)) gone.push(id);
    prev = now;
    return { t: 'progress', region, step, agents: changed, gone };
  };
}
async function loopServer() {
  const A = await loadAssets(); T = S.loadTerrain(A.terrain);
  // Recovery. The server sends a heartbeat every 20 s; with no message for 45 s the connection is dead.
  // A socket that is dropped is abandoned at once (its late events are ignored): waiting for its closing
  // handshake can take minutes on a mobile network that vanished during sleep. Coming back to the foreground
  // after more than 20 s away always starts a fresh connection — mobile systems kill background sockets
  // without telling the page — and abandons a unit whose lease has expired meanwhile.
  let sock = null, gen = 0, backoff = 1000, waiting = null, lastMsgAt = 0, reconnectTimer = null, firstHello = null, hiddenAt = 0;
  const send = o => { if (sock?.readyState === 1) sock.send(JSON.stringify(o)); };
  const schedule = delay => { if (reconnectTimer) clearTimeout(reconnectTimer); reconnectTimer = setTimeout(connect, delay); };
  const lost = () => {
    link = 'reconnecting'; abortUnit(); peers.clear();
    if (waiting) { const w = waiting; waiting = null; w({ t: 'nack', reason: 'disconnected' }); }
  };
  const connect = () => {
    if (reconnectTimer) { clearTimeout(reconnectTimer); reconnectTimer = null; }
    if (sock && sock.readyState < 2) return;
    const my = ++gen, s = new WebSocket(location.origin.replace(/^http/, 'ws') + '/ws');
    sock = s; lastMsgAt = Date.now(); link = 'connecting';
    s.onopen = () => { if (my !== gen) return; backoff = 1000; send({ t: 'hello', sigil: ME }); };
    s.onmessage = ev => {
      if (my !== gen) return;
      lastMsgAt = Date.now();
      const m = JSON.parse(ev.data);
      switch (m.t) {
        case 'hello': link = 'ok'; online = m.online; setWorld(S.unpackSnapshot(m.world)); peers.clear(); for (const p of m.peers) peers.set(p.sigil, { region: p.region, step: p.step, agents: [], at: Date.now() }); if (firstHello) { const f = firstHello; firstHello = null; f(); } break;
        case 'world': setWorld(S.unpackSnapshot(m.world)); break;
        case 'delta':
          if (!world || m.seq !== world.seq + 1) { send({ t: 'resync' }); break; }     // gap in the sequence: ask for the full state
          S.applyDelta(world, m); break;
        case 'chronicle': addChron(S.unpackEntry(m.entry), true); break;
        case 'market': if (world) { world.market = m.market; world.climate = m.climate; } break;
        case 'online': case 'tick': online = m.online; break;
        case 'lease': peers.set(m.sigil, { region: m.region, step: 0, agents: [], at: Date.now() }); break;
        case 'progress': {
          const pr = peers.get(m.sigil) || { region: m.region, agents: [], map: new Map() };
          if (m.full || !pr.map) pr.map = new Map();
          for (const a of m.agents) pr.map.set(a[0], a);
          for (const id of m.gone || []) pr.map.delete(id);
          pr.region = m.region; pr.step = m.step; pr.agents = [...pr.map.values()]; pr.at = Date.now(); peers.set(m.sigil, pr); break;
        }
        case 'release': peers.delete(m.sigil); break;
        case 'unit': case 'ack': case 'nack': if (waiting) { const w = waiting; waiting = null; w(m); } break;
      }
    };
    s.onclose = () => {
      if (my !== gen) return;
      sock = null; lost(); schedule(backoff); backoff = Math.min(15000, backoff * 2);
    };
    s.onerror = () => {};
  };
  // abandon the current socket now and reconnect (immediately, or after the backoff)
  const dropSocket = (now = false) => {
    const s = sock; gen++; sock = null;
    try { s?.close(); } catch {}
    lost();
    if (now) connect(); else { schedule(backoff); backoff = Math.min(15000, backoff * 2); }
  };
  const kick = () => {
    backoff = 1000;
    if (!sock) { connect(); return; }
    if (sock.readyState === 1 && Date.now() - lastMsgAt > 30000) dropSocket(true);    // apparently open, silent for too long
    else if (sock.readyState === 0 && Date.now() - lastMsgAt > 10000) dropSocket(true); // stuck connecting
  };

    const away = hiddenAt ? Date.now() - hiddenAt : 0; hiddenAt = 0;
    if (run && Date.now() - run.startedAt > 80000) abortUnit();                         // its lease has expired
    if (away > 20000) { backoff = 1000; dropSocket(true); } else kick();
  };
  setInterval(() => { if (sock?.readyState === 1 && Date.now() - lastMsgAt > 45000) dropSocket(); }, 5000);
  addEventListener('online', kick); addEventListener('focus', kick);
  addEventListener('pageshow', e => { if (e.persisted) { hiddenAt = hiddenAt || 1; resume(); } else kick(); });   // restored from the back-forward cache

  const ask = o => new Promise(res => { waiting = res; send(o); setTimeout(() => { if (waiting === res) { waiting = null; res({ t: 'nack', reason: 'timeout' }); dropSocket(true); } }, 20000); });

      const unit = S.unpackUnit(m.unit), verify = m.verify;
      const started = Date.now();
      const prog = progressSender(unit.region);
      await runUnit(unit, verify, async (result, ms) => {
        if (Date.now() - started > 80000 || sock?.readyState !== 1) return;        // computation interrupted too long (hidden tab, sleep): the lease expired, send nothing
        const r = await ask({ t: 'result', result: S.packResult(result), verify, hash: S.hashResult(result), ms: Math.round(ms) });
        if (r.t === 'ack') { tele.units++; tele.ticks += STEPS; tele.decisions += result.decisions; }
      }, (step, agents) => send(prog(step, agents)));
      lease = null;
      await sleep(900 + Math.random() * 1500);
    } catch (e) { lease = null; await sleep(5000); }
  }
}

// demo mode: the world lives in the tab, with a simulated past and index
function syntheticMarket(day) {
  const d0 = Date.UTC(2026, 0, 1), n = Math.floor((day - d0) / 86400000);
  let v = 6000, prev = 6000, seed = 0x2545F491;
  const rnd = () => { seed ^= seed << 13; seed ^= seed >>> 17; seed ^= seed << 5; return ((seed >>> 0) / 4294967296) - 0.5; };
  for (let i = 0; i <= n; i++) { prev = v; v *= 1 + rnd() * 0.02 + 0.0003; }
  return { date: new Date(day).toISOString().slice(0, 10), close: Math.round(v * 100) / 100, prev, change: ((v - prev) / prev) * 100, source: 'synthetic' };
}
async function loopDemo() {
  const A = await loadAssets(); T = S.loadTerrain(A.terrain);
  const w = S.World.create(20261007, T);
  const t0 = Date.now() - 37 * 86400000, gap = 3 * 3600000;
  w.s.created = t0; w.s.chronicle[0].t = t0;
  const ghosts = ['K7QD-3MZA', 'B2VX-9HLP', 'ZQ0F-P1NR', 'H8WT-4ECS'];
  for (let i = 0; i < 96; i++) {
    const g = ghosts[i % 4], at = t0 + (i < 24 ? i * gap : 19 * 86400000 + i * gap);
    w.setMarket(syntheticMarket(at));
    const u = w.lease(g, at); if (u) w.integrate(S.simulateUnit(w.T, u), g, { now: at });
  }
  for (const c of w.s.chronicle) c.t = Math.min(c.t, Date.now() - 60000);
  w.setMarket(syntheticMarket(Date.now()));
  online = 1 + Math.floor(Math.random() * 3);
  setWorld(S.unpackSnapshot(JSON.parse(JSON.stringify(w.snapshot(online)))));
  for (;;) {
    const unit = w.lease(ME);
    await runUnit(unit, false, (result) => { const r = w.integrate(result, ME); tele.units++; tele.ticks += STEPS; tele.decisions += result.decisions; S.applyDelta(world, JSON.parse(JSON.stringify(r.delta))); for (const e of r.entries) addChron(S.unpackEntry(S.packEntry(e)), true); });
    lease = null;
    await sleep(900 + Math.random() * 1500);
  }
}
(DEMO ? loopDemo : loopServer)();
