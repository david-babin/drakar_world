<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>drakar</title>
<meta name="description" content="Un monde. Il n'avance que si quelqu'un le regarde.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&family=IBM+Plex+Mono:wght@300;400&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #07090c; --ink: #c9c2b2; --dim: #6c6a60; --faint: #3a3d3f; --line: #1d2429; --accent: #d9a85c;
  --mono: 'IBM Plex Mono', ui-monospace, monospace; --serif: 'Cormorant Garamond', Georgia, serif;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; background: var(--bg); color: var(--ink); overflow: hidden; }
body { font-family: var(--mono); font-weight: 300; font-size: 11px; letter-spacing: .02em; }
canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
#globe { cursor: grab; touch-action: none; } #globe.drag { cursor: grabbing; }
html, body { overscroll-behavior: none; }
#over { pointer-events: none; }
#veil { position: fixed; inset: 0; background: var(--bg); pointer-events: none; transition: opacity 2.4s ease; }
.hud { position: fixed; pointer-events: none; color: var(--dim); line-height: 1.7; }
.hud b { color: var(--ink); font-weight: 400; }
.hud i { color: var(--accent); font-style: normal; }
.hud i.dn { color: #7fa3c4; }
#brand { left: 20px; bottom: 16px; font-family: var(--serif); font-size: 28px; letter-spacing: .14em; color: var(--ink); font-weight: 400; }
#brand small { display: block; font-family: var(--mono); font-size: 10px; letter-spacing: .18em; color: var(--dim); margin-top: -2px; }
#era { left: 20px; top: 16px; font-family: var(--serif); font-size: 15px; letter-spacing: .08em; color: var(--ink); }
#era small { display: block; font-family: var(--mono); font-size: 10px; color: var(--dim); letter-spacing: .1em; margin-top: 2px; }
#tele { right: 20px; top: 16px; text-align: right; white-space: pre; }
#chron { right: 20px; bottom: 16px; width: 300px; max-height: 40vh; overflow: hidden; text-align: right;
  -webkit-mask-image: linear-gradient(to bottom, transparent, #000 35%); mask-image: linear-gradient(to bottom, transparent, #000 35%); }
#chron div { padding: 1px 0; opacity: .85; }
#chron div.new { animation: rise 1.4s ease both; }
#chron em { color: var(--faint); font-style: normal; margin-left: 8px; }
#chron span.an { color: var(--dim); margin-right: 8px; }
@keyframes rise { from { opacity: 0; transform: translateY(6px); } to { opacity: .85; transform: none; } }
#status { left: 20px; bottom: 76px; }
#status .bar { display: inline-block; width: 120px; height: 2px; background: var(--line); vertical-align: middle; margin-left: 8px; }
#status .bar i { display: block; height: 100%; background: var(--accent); width: 0; transition: width .12s linear; }
#tip { position: fixed; pointer-events: none; padding: 6px 9px; background: rgba(7,9,12,.92); border: 1px solid var(--line); color: var(--ink); display: none; white-space: nowrap; }
#tip small { color: var(--dim); display: block; }
@media (max-width: 720px) { #tele, #chron { display: none; } #brand { font-size: 22px; } body { font-size: 10px; } }
</style>
</head>
<body>
<canvas id="globe"></canvas>
<canvas id="over"></canvas>
<div id="veil"></div>

<div id="era" class="hud">An —<small>—</small></div>
<div id="tele" class="hud"></div>
<div id="status" class="hud"></div>
<div id="chron" class="hud"></div>
<div id="brand" class="hud">drakar<small>.tech</small></div>
<div id="tip"></div>

<script type="module">
import * as S from './sim.js';
const { W, H, RX, RY, RW, RH, STEPS, ROMAN } = S;
const DEG = Math.PI / 180;

// ---------- identité du visiteur ----------
function sigil() {
  try { const s = localStorage.getItem('drakar.sigil'); if (s) return s; } catch {}
  const src = [navigator.hardwareConcurrency, navigator.deviceMemory, screen.width, screen.height, screen.colorDepth,
    Intl.DateTimeFormat().resolvedOptions().timeZone, navigator.language, navigator.platform, Math.random()].join('|');
  const h = S.hashStr(src).toString(36).toUpperCase().padStart(8, '0');
  const sg = `${h.slice(0, 4)}-${h.slice(4, 8)}`;
  try { localStorage.setItem('drakar.sigil', sg); } catch {}
  return sg;
}
const ME = sigil();

// ---------- télémétrie machine ----------
const tele = { cores: navigator.hardwareConcurrency || 0, mem: navigator.deviceMemory || 0, gpu: '—', batt: null, net: null, fps: 0, dps: 0, units: 0, ticks: 0, decisions: 0 };
(async () => {
  try { const b = await navigator.getBattery?.(); if (b) { const u = () => tele.batt = { level: b.level, charging: b.charging }; u(); b.onlevelchange = b.onchargingchange = u; } } catch {}
  try { const n = navigator.connection; if (n) { const u = () => tele.net = { type: n.effectiveType, rtt: n.rtt }; u(); n.onchange = u; } } catch {}
})();

// ---------- état ----------
const DEMO = !!window.DRAKAR_DATA || !location.protocol.startsWith('http') || new URLSearchParams(location.search).has('demo');
let world = null, T = null, online = 1, lease = null;
const peers = new Map();            // sigil → { region, step, agents: [[id,x,y,lin,pop]], at }
const PEER_TTL = 6000;
const chron = document.getElementById('chron');
const $ = id => document.getElementById(id);

// ---------- globe WebGL ----------
const gcv = $('globe'), ocv = $('over'), octx = ocv.getContext('2d');
const gl = gcv.getContext('webgl', { antialias: true, alpha: false, premultipliedAlpha: false });
const VS = `attribute vec2 p; varying vec2 v; void main(){ v = p; gl_Position = vec4(p, 0., 1.); }`;
const FS = `
precision highp float;
varying vec2 v;
uniform vec2 res; uniform vec2 center; uniform float R; uniform float lon0, lat0; uniform float climate; uniform float time;
uniform sampler2D tex;
const float PI = 3.14159265;
vec3 colType(float t) {
  if (t < 0.5) return vec3(0.047, 0.078, 0.106);
  if (t < 1.5) return vec3(0.071, 0.118, 0.157);
  if (t < 2.5) return vec3(0.118, 0.145, 0.157);
  if (t < 3.5) return vec3(0.150, 0.178, 0.185);
  if (t < 4.5) return vec3(0.195, 0.222, 0.228);
  return vec3(0.135, 0.165, 0.19);
}
void main() {
  vec2 px = v * res * .5;                       // pixels depuis le centre de l'écran
  vec2 q = (px - center) / R;                   // coordonnées sur le disque
  float d2 = dot(q, q);
  vec3 bg = vec3(0.027, 0.035, 0.047);
  float tint = climate;                         // ambre si expansion, bleu si contraction
  vec3 glowC = tint >= 0. ? vec3(0.85, 0.66, 0.36) : vec3(0.50, 0.64, 0.77);
  if (d2 > 1.0) {
    float d = sqrt(d2);
    float halo = exp(-(d - 1.0) * 14.0) * (0.10 + 0.10 * abs(tint));
    gl_FragColor = vec4(bg + glowC * halo, 1.); return;
  }
  float z = sqrt(1.0 - d2);
  float cl0 = cos(lat0), sl0 = sin(lat0);
  float lat = asin(clamp(q.y * cl0 + z * sl0, -1., 1.));
  float lon = lon0 + atan(q.x, cl0 * z - q.y * sl0);
  vec2 uv = vec2(mod(lon / (2. * PI) + .5, 1.), 0.5 - lat / PI);
  float v = floor(texture2D(tex, uv).r * 255. + .5);
  float t = floor(v / 32.), lvl = mod(v, 32.) / 2.;
  vec3 c = colType(t) * (1.0 + lvl * 0.035);         // les hauteurs s'éclaircissent doucement
  // graticule 15°
  float gla = abs(fract(lat / PI * 12. + .5) - .5), glo = abs(fract(lon / PI * 12. + .5) - .5);
  float gw = 0.012 * (1.0 + 3.0 * (1.0 - z));
  float grat = (1.0 - smoothstep(0.0, gw, gla)) + (1.0 - smoothstep(0.0, gw, glo));
  c += vec3(0.79, 0.76, 0.70) * grat * 0.045;
  // relief : limbe assombri, lumière rasante
  float shade = 0.55 + 0.45 * pow(z, 0.6);
  c *= shade;
  c += glowC * (0.05 * abs(tint)) * (1.0 - z);  // saison
  float aa = smoothstep(1.0, 1.0 - 2.0 / R, d2);
  gl_FragColor = vec4(mix(bg, c, aa), 1.);
}`;
function shader(type, src) { const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s); if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s)); return s; }
const prog = gl.createProgram(); gl.attachShader(prog, shader(gl.VERTEX_SHADER, VS)); gl.attachShader(prog, shader(gl.FRAGMENT_SHADER, FS)); gl.linkProgram(prog); gl.useProgram(prog);
const buf = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, buf); gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 1, -1, -1, 1, 1, 1]), gl.STATIC_DRAW);
const loc = gl.getAttribLocation(prog, 'p'); gl.enableVertexAttribArray(loc); gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);
const U = n => gl.getUniformLocation(prog, n);
const tex = gl.createTexture(); gl.bindTexture(gl.TEXTURE_2D, tex);
gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.NEAREST); gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.NEAREST);
gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE); gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
gl.pixelStorei(gl.UNPACK_COLORSPACE_CONVERSION_WEBGL, gl.NONE);
function uploadFond(img) { gl.bindTexture(gl.TEXTURE_2D, tex); gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, img); }

// ---------- données Terre ----------
// terre.bin (grille de simulation), fond.png (remplissage), cotes.bin et niveaux.bin (lignes, int16 centièmes de degré)
function parseLines(buf, withLevel) {
  const dv = new DataView(buf); const n = dv.getUint32(0, true); let o = 4; const out = [];
  for (let i = 0; i < n; i++) {
    let level = 0; if (withLevel) { level = dv.getUint8(o); o += 1; }
    const m = dv.getUint16(o, true); o += 2;
    const lon = new Float32Array(m), cl = new Float32Array(m), sl = new Float32Array(m);
    for (let j = 0; j < m; j++) { const la = dv.getInt16(o + 2, true) / 100 * DEG; lon[j] = dv.getInt16(o, true) / 100 * DEG; cl[j] = Math.cos(la); sl[j] = Math.sin(la); o += 4; }
    out.push({ level, n: m, lon, cl, sl });
  }
  return out;
}
const b64 = s => { const bin = atob(s), u = new Uint8Array(bin.length); for (let i = 0; i < u.length; i++) u[i] = bin.charCodeAt(i); return u.buffer; };
async function loadAssets() {
  const E = window.DRAKAR_DATA;                        // version autonome (demo.html) : données inlinées
  const get = async (name) => E ? b64(E[name]) : await (await fetch('/' + name)).arrayBuffer();
  const [terre, cotes, niveaux] = await Promise.all([get('terre.bin'), get('cotes.bin'), get('niveaux.bin')]);
  const img = new Image(); img.src = E ? 'data:image/png;base64,' + E['fond.png'] : '/fond.png';
  await img.decode();
  return { terre, img, cotes: parseLines(cotes, false), niveaux: parseLines(niveaux, true) };
}
let LINES = null;

// ---------- caméra ----------
const cam = { lon: 20 * DEG, lat: 18 * DEG, zoom: 1, vlon: 0, vlat: 0, idle: 0, target: null };
const regionCenter = reg => ({ lon: (((reg % RX) + .5) * RW / W * 360 - 180) * DEG, lat: (90 - (Math.floor(reg / RX) + .5) * RH / H * 180) * DEG });
let dpr = 1, cw = 0, ch = 0, R = 0, cx = 0, cy = 0;
function resize() {
  dpr = Math.min(2, devicePixelRatio || 1);
  cw = innerWidth; ch = innerHeight;
  gcv.width = ocv.width = cw * dpr; gcv.height = ocv.height = ch * dpr;
  gl.viewport(0, 0, gcv.width, gcv.height);
}
addEventListener('resize', resize); resize();
function layout() {
  R = Math.min(cw, ch) * 0.42 * cam.zoom;
  cx = cw > 900 ? cw * 0.46 : cw / 2; cy = ch / 2;
}
// projection orthographique : grille → écran ; retourne null si face cachée
const sinLat = new Float64Array(H), cosLat = new Float64Array(H);
for (let y = 0; y < H; y++) { const l = S.latOf(y) * DEG; sinLat[y] = Math.sin(l); cosLat[y] = Math.cos(l); }
function project(x, y, out) {
  const lon = S.lonOf(x) * DEG, dl = lon - cam.lon;
  const cl0 = Math.cos(cam.lat), sl0 = Math.sin(cam.lat);
  const cosc = sl0 * sinLat[y] + cl0 * cosLat[y] * Math.cos(dl);
  if (cosc < 0) return null;
  out.x = cx + R * cosLat[y] * Math.sin(dl);
  out.y = cy - R * (cl0 * sinLat[y] - sl0 * cosLat[y] * Math.cos(dl));
  out.c = cosc;
  return out;
}
function projectLL(lon, lat, out) {
  const dl = lon - cam.lon, cl0 = Math.cos(cam.lat), sl0 = Math.sin(cam.lat);
  const cosc = sl0 * Math.sin(lat) + cl0 * Math.cos(lat) * Math.cos(dl);
  out.x = cx + R * Math.cos(lat) * Math.sin(dl); out.y = cy - R * (cl0 * Math.sin(lat) - sl0 * Math.cos(lat) * Math.cos(dl)); out.c = cosc;
  return cosc >= 0 ? out : null;
}
// arc de grand cercle entre deux cellules (slerp), tracé par segments visibles
function geodesic(ax, ay, bx, by, steps) {
  const la = S.lonOf(ax) * DEG, pa = S.latOf(ay) * DEG, lb = S.lonOf(bx) * DEG, pb = S.latOf(by) * DEG;
  const A = [Math.cos(pa) * Math.cos(la), Math.cos(pa) * Math.sin(la), Math.sin(pa)], B = [Math.cos(pb) * Math.cos(lb), Math.cos(pb) * Math.sin(lb), Math.sin(pb)];
  const d = Math.acos(Math.max(-1, Math.min(1, A[0] * B[0] + A[1] * B[1] + A[2] * B[2]))) || 1e-6;
  const n = Math.max(2, Math.min(steps, Math.ceil(d / (2 * DEG))));
  const pts = [], o = {};
  for (let i = 0; i <= n; i++) {
    const t = i / n, s1 = Math.sin((1 - t) * d) / Math.sin(d), s2 = Math.sin(t * d) / Math.sin(d);
    const x = s1 * A[0] + s2 * B[0], y = s1 * A[1] + s2 * B[1], z = s1 * A[2] + s2 * B[2];
    const p = projectLL(Math.atan2(y, x), Math.asin(z), o);
    pts.push(p ? [p.x, p.y] : null);
  }
  return pts;
}
// trace une ligne précalculée (cos/sin lat) avec coupure sur la face cachée
function traceLine(g, L) {
  const cl0 = Math.cos(cam.lat), sl0 = Math.sin(cam.lat);
  let on = false;
  for (let j = 0; j < L.n; j++) {
    const dl = L.lon[j] - cam.lon, cd = Math.cos(dl);
    const cosc = sl0 * L.sl[j] + cl0 * L.cl[j] * cd;
    if (cosc < 0.02) { on = false; continue; }
    const x = cx + R * L.cl[j] * Math.sin(dl), y = cy - R * (cl0 * L.sl[j] - sl0 * L.cl[j] * cd);
    if (!on) { g.moveTo(x, y); on = true; } else g.lineTo(x, y);
  }
}
// calque des côtes et courbes de niveau, redessiné seulement quand la caméra change
const linesCv = document.createElement('canvas'); const lctx = linesCv.getContext('2d');
let linesKey = '', linesAt = 0;
function linesLayer(now) {
  const key = `${cam.lon.toFixed(5)}|${cam.lat.toFixed(5)}|${R.toFixed(1)}|${cw}x${ch}|${dpr}`;
  if (key === linesKey) return linesCv;
  if (!(drag || pinch) && now - linesAt < 100) return linesCv;      // en dérive lente, 10 Hz suffisent
  linesKey = key; linesAt = now;
  if (linesCv.width !== cw * dpr || linesCv.height !== ch * dpr) { linesCv.width = cw * dpr; linesCv.height = ch * dpr; }
  lctx.setTransform(dpr, 0, 0, dpr, 0, 0); lctx.clearRect(0, 0, cw, ch);
  const zf = Math.min(1, 0.55 + cam.zoom * 0.25);
  for (let lv = 0; lv < 5; lv++) {
    lctx.strokeStyle = `rgba(201,194,178,${(0.07 + lv * 0.035) * zf})`; lctx.lineWidth = 0.6;
    lctx.beginPath(); for (const L of LINES.niveaux) if (L.level === lv) traceLine(lctx, L); lctx.stroke();
  }
  lctx.strokeStyle = 'rgba(201,194,178,.42)'; lctx.lineWidth = 0.8;
  lctx.beginPath(); for (const L of LINES.cotes) traceLine(lctx, L); lctx.stroke();
  return linesCv;
}
function strokePath(pts) {
  let on = false;
  for (const p of pts) {
    if (!p) { on = false; continue; }
    if (!on) { octx.moveTo(p[0], p[1]); on = true; } else octx.lineTo(p[0], p[1]);
  }
}

// ---------- interactions ----------
const ptrs = new Map();                        // pointeurs actifs (souris, doigts)
let drag = null, pinch = null;
const clampLat = l => Math.max(-80 * DEG, Math.min(80 * DEG, l));
const zoomTo = z => { cam.zoom = Math.max(0.6, Math.min(5, z)); cam.idle = 0; };
gcv.addEventListener('pointerdown', e => {
  gcv.setPointerCapture(e.pointerId); ptrs.set(e.pointerId, { x: e.clientX, y: e.clientY });
  cam.vlon = cam.vlat = 0; cam.idle = 0;
  if (ptrs.size === 1) { drag = { x: e.clientX, y: e.clientY, lon: cam.lon, lat: cam.lat }; gcv.classList.add('drag'); }
  else if (ptrs.size === 2) { const [a, b] = [...ptrs.values()]; pinch = { d: Math.hypot(a.x - b.x, a.y - b.y), z: cam.zoom }; drag = null; }
});
gcv.addEventListener('pointermove', e => {
  if (ptrs.has(e.pointerId)) ptrs.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (pinch && ptrs.size >= 2) { const [a, b] = [...ptrs.values()]; zoomTo(pinch.z * Math.hypot(a.x - b.x, a.y - b.y) / pinch.d); return; }
  if (drag) {
    const k = 1 / R;
    const nlon = drag.lon - (e.clientX - drag.x) * k, nlat = clampLat(drag.lat + (e.clientY - drag.y) * k);
    cam.vlon = (nlon - cam.lon) * 0.5; cam.vlat = (nlat - cam.lat) * 0.5;
    cam.lon = nlon; cam.lat = nlat; cam.idle = 0;
  } else if (ptrs.size === 0) hoverAt(e.clientX, e.clientY);
});
const endPtr = e => { ptrs.delete(e.pointerId); if (ptrs.size < 2) pinch = null; if (ptrs.size === 0) { drag = null; gcv.classList.remove('drag'); } else if (ptrs.size === 1 && !drag) { const [p] = [...ptrs.values()]; drag = { x: p.x, y: p.y, lon: cam.lon, lat: cam.lat }; } cam.idle = 0; };
gcv.addEventListener('pointerup', endPtr); gcv.addEventListener('pointercancel', endPtr);
// la molette (et le pincement trackpad, qui arrive en ctrl+molette) ne zoome que le globe, jamais la page
addEventListener('wheel', e => { e.preventDefault(); zoomTo(cam.zoom * Math.exp(-e.deltaY * (e.ctrlKey ? 0.01 : 0.0012))); }, { passive: false });
addEventListener('keydown', e => { if ((e.ctrlKey || e.metaKey) && ['+', '-', '=', '0'].includes(e.key)) e.preventDefault(); });
addEventListener('gesturestart', e => e.preventDefault());
gcv.addEventListener('mouseleave', () => tip.style.display = 'none');

// ---------- rendu ----------
const hue = lin => world?.lineages[lin]?.hue ?? 0;
let last = performance.now(), frames = 0, fpsAt = last, hits = [];
function frame(now) {
  requestAnimationFrame(frame);
  if (!world) return;
  frames++; if (now - fpsAt > 1000) { tele.fps = frames; frames = 0; fpsAt = now; }
  // inertie et rotation lente au repos
  if (!drag && !pinch) {
    cam.lon += cam.vlon; cam.lat = clampLat(cam.lat + cam.vlat);
    cam.vlon *= 0.92; cam.vlat *= 0.92;
    cam.idle++;
    // après 6 s sans manipulation, la caméra glisse vers la zone en calcul (la mienne, sinon celle d'un autre témoin)
    if (cam.idle > 360) {
      let reg = lease ? lease.unit.region : null;
      if (reg == null) { let best = 0; for (const pr of peers.values()) if (pr.at > best) { best = pr.at; reg = pr.region; } }
      if (reg != null) cam.target = regionCenter(reg);
      const ease = Math.min(0.012, (cam.idle - 360) / 20000);
      if (cam.target) {
        let dl = cam.target.lon - cam.lon; dl = Math.atan2(Math.sin(dl), Math.cos(dl));
        cam.lon += dl * ease; cam.lat += (clampLat(cam.target.lat) - cam.lat) * ease;
      } else cam.lon += 0.00035 * Math.min(1, (cam.idle - 360) / 300);
    }
  }
  layout();

  gl.uniform2f(U('res'), cw, ch); gl.uniform2f(U('center'), cx - cw / 2, ch / 2 - cy); gl.uniform1f(U('R'), R);
  gl.uniform1f(U('lon0'), cam.lon); gl.uniform1f(U('lat0'), cam.lat); gl.uniform1f(U('climate'), world.climate || 0); gl.uniform1f(U('time'), now / 1000);
  gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);

  octx.setTransform(dpr, 0, 0, dpr, 0, 0); octx.clearRect(0, 0, cw, ch);
  const o = {};
  hits = [];

  // régions en cours de calcul (contour lat/lon)
  const regionBox = (reg, color, dash) => {
    const rx = reg % RX, ry = Math.floor(reg / RX);
    const x0 = rx * RW, y0 = ry * RH, x1 = x0 + RW, y1 = y0 + RH;
    const corners = [[x0, y0], [x1, y0], [x1, y1], [x0, y1], [x0, y0]];
    octx.strokeStyle = color; octx.lineWidth = 1; octx.setLineDash(dash); octx.lineDashOffset = -now / 40;
    octx.beginPath();
    for (let i = 0; i < 4; i++) {
      const [ax, ay] = corners[i], [bx, by] = corners[i + 1], pts = [];
      for (let j = 0; j <= 16; j++) { const x = ax + (bx - ax) * j / 16, y = ay + (by - ay) * j / 16; const p = projectLL(((x / W) * 360 - 180) * DEG, (90 - (y / H) * 180) * DEG, o); pts.push(p ? [p.x, p.y] : null); }
      strokePath(pts);
    }
    octx.stroke(); octx.setLineDash([]);
  };
  const tnow = Date.now();
  for (const [sg, pr] of peers) if (tnow - pr.at > PEER_TTL) peers.delete(sg);
  for (const [sg, pr] of peers) {
    regionBox(pr.region, 'rgba(201,194,178,.26)', [2, 6]);
    const rx = pr.region % RX, ry = Math.floor(pr.region / RX);
    const c = projectLL(((rx + .5) * RW / W * 360 - 180) * DEG, (90 - (ry + .5) * RH / H * 180) * DEG, o);
    if (c && c.c > 0.2) { octx.font = '300 9px IBM Plex Mono'; octx.fillStyle = `rgba(201,194,178,${0.5 * c.c})`; octx.textAlign = 'center'; octx.fillText(`${sg} · ${(100 * pr.step / STEPS) | 0} %`, c.x, c.y); }
  }
  if (lease) regionBox(lease.unit.region, 'rgba(217,168,92,.6)', [3, 5]);

  // relief : courbes de niveau (500 · 1000 · 2000 · 3000 · 4000 m), puis côtes
  if (LINES) { const lc = linesLayer(now); octx.setTransform(1, 0, 0, 1, 0, 0); octx.drawImage(lc, 0, 0); octx.setTransform(dpr, 0, 0, dpr, 0, 0); }

  // routes
  const byId = new Map(world.settlements.map(s => [s.id, s]));
  octx.lineWidth = 0.9;
  for (const r of world.routes) {
    const a = byId.get(r.a), b = byId.get(r.b); if (!a || !b) continue;
    const age = Math.min(1, (world.tick - r.tick) / 600);
    octx.strokeStyle = `hsla(${hue(r.lin)},45%,70%,${0.18 + 0.3 * age})`;
    octx.setLineDash(r.sea ? [2, 4] : []);
    octx.beginPath(); strokePath(geodesic(a.x, a.y, b.x, b.y, 48)); octx.stroke();
  }
  octx.setLineDash([]);

  // comptoirs
  const showLabels = R > 420;
  for (const st of world.settlements) {
    const p = project(st.x, st.y, o); if (!p) continue;
    const a = 0.35 + 0.65 * p.c;
    octx.strokeStyle = `hsla(${hue(st.lin)},55%,62%,${a})`; octx.lineWidth = 1;
    octx.beginPath(); octx.rect(p.x - 2.5, p.y - 2.5, 5, 5); octx.stroke();
    octx.beginPath(); octx.moveTo(p.x, p.y - 2.5); octx.lineTo(p.x, p.y - 7); octx.stroke();
    if (showLabels && p.c > 0.35) { octx.font = '300 9px IBM Plex Mono'; octx.fillStyle = `rgba(201,194,178,${0.55 * p.c})`; octx.textAlign = 'left'; octx.fillText(st.name, p.x + 6, p.y + 3); }
    hits.push({ x: p.x, y: p.y, st });
  }

  // groupes
  const animated = new Set(lease ? lease.agents.map(a => a.id) : []);
  for (const pr of peers.values()) for (const a of pr.agents) animated.add(a[0]);
  const drawAgent = (a, alpha) => {
    const p = project(a.x, a.y, o); if (!p) return;
    const r = Math.min(4, 1 + Math.sqrt(a.pop) * .2) * (0.6 + 0.4 * p.c);
    octx.fillStyle = `hsla(${hue(a.lin)},60%,66%,${alpha * (0.3 + 0.7 * p.c)})`;
    octx.beginPath(); octx.arc(p.x, p.y, r, 0, 6.283); octx.fill();
    hits.push({ x: p.x, y: p.y, ag: a });
  };
  for (const a of world.agents) if (!animated.has(a.id)) drawAgent(a, .8);
  for (const pr of peers.values()) for (const [id, x, y, lin, pop] of pr.agents) if (pop > 0) drawAgent({ id, x, y, lin, pop, food: 0, g: [] }, .9);
  if (lease) for (const a of lease.agents) if (a.pop > 0) drawAgent(a, 1);

  // mémoires : événements récents
  const t = Date.now();
  for (const e of world.chronicle.slice(-12)) if (e.x != null && t - e.t < 20000) {
    const p = project(e.x, e.y, o); if (!p) continue;
    const k = 1 - (t - e.t) / 20000;
    octx.strokeStyle = `hsla(${hue(e.lin)},60%,66%,${k * .5})`; octx.lineWidth = .8;
    octx.beginPath(); octx.arc(p.x, p.y, 6 + (1 - k) * 18, 0, 6.283); octx.stroke();
  }

  if (now - last > 250) { last = now; hud(); }
}
requestAnimationFrame(frame);

// ---------- survol ----------
const tip = $('tip');
function hoverAt(mx, my) {
  if (!world) return;
  let best = null, bd = 64;
  for (const h of hits) { const d = (h.x - mx) ** 2 + (h.y - my) ** 2; if (d < bd) { bd = d; best = h; } }
  if (!best) { tip.style.display = 'none'; return; }
  tip.style.display = 'block'; tip.style.left = mx + 14 + 'px'; tip.style.top = my + 14 + 'px';
  if (best.st) { const st = best.st, n = world.routes.filter(r => r.a === st.id || r.b === st.id).length;
    tip.innerHTML = `${st.name}<small>${world.lineages[st.lin].name} · fondée an ${Math.floor(st.founded / 4)} · ${n} route${n > 1 ? 's' : ''}${st.sigil ? ' · témoin ' + st.sigil : ''}</small>`; }
  else { const ag = best.ag; tip.innerHTML = `lignée ${world.lineages[ag.lin].name}<small>${ag.pop} âmes · vivres ${Math.floor(ag.food)} · ${S.latOf(ag.y).toFixed(1)}° ${S.lonOf(ag.x).toFixed(1)}°<br>génome ${ag.g.map(v => v.toString(16).padStart(2, '0')).join('')}</small>`; }
}

// ---------- HUD ----------
const fmt = n => n.toLocaleString('fr-FR');
function hud() {
  const pop = world.agents.reduce((n, a) => n + a.pop, 0);
  const alive = world.lineages.filter(l => !l.dead).length;
  const age = Math.max(0, Math.floor((Date.now() - world.created) / 86400000));
  $('era').innerHTML = `An ${fmt(world.year)}<small>${fmt(pop)} âmes · ${world.settlements.length} comptoirs · ${world.routes.length} routes · ${alive} lignées · ${age} j</small>`;
  const b = tele.batt ? `${Math.round(tele.batt.level * 100)}% ${tele.batt.charging ? '⚡' : ''}` : '—';
  const n = tele.net ? `${tele.net.type} ${tele.net.rtt}ms` : '—';
  const m = world.market;
  const mk = m ? `${m.close.toLocaleString('fr-FR', { minimumFractionDigits: 2, maximumFractionDigits: 2 })} <i class="${m.change < 0 ? 'dn' : ''}">${m.change >= 0 ? '▲' : '▼'} ${Math.abs(m.change).toFixed(2).replace('.', ',')} %</i>${m.live ? ' · <b>direct</b>' : ''}` : '—';
  const withPeers = [...peers.entries()].map(([sg, pr]) => `${sg} <i>${ROMAN[pr.region]}</i>`).join(' · ');
  const season = world.climate > 0.25 ? 'abondance' : world.climate < -0.25 ? 'disette' : 'saison ordinaire';
  $('tele').innerHTML =
`<b>${ME}</b>
cpu <b>${tele.cores || '?'}</b> · mem <b>${tele.mem ? tele.mem + ' Go' : '?'}</b> · fps <b>${tele.fps}</b>
batt <b>${b}</b> · net <b>${n}</b>
<i>${fmt(tele.dps)} déc/s</i> · unités <b>${tele.units}</b> · saisons <b>${fmt(tele.ticks)}</b>
en ligne <b>${online}</b> · témoins <b>${world.contributors}</b>
total <b>${fmt(world.totals.decisions)}</b> décisions${withPeers ? '\navec ' + withPeers : ''}

indice ${mk}
climat <b>${season}</b>${m?.source === 'synthétique' ? ' · <i class="dn">flux simulé</i>' : ''}`;
  let st = '';
  if (lease) st = `calcul · région <i>${ROMAN[lease.unit.region]}</i><span class="bar"><i style="width:${(100 * lease.step / STEPS) | 0}%"></i></span>`;
  else if (DEMO) st = `mode démo · monde local`;
  else st = `synchronisation`;
  $('status').innerHTML = st;
}
function addChron(e, isNew) {
  const d = document.createElement('div'); if (isNew) d.className = 'new';
  d.innerHTML = `<span class="an">${e.an || 'An ' + Math.floor(e.tick / 4)}</span>${e.text}<em>${e.sigil === ME ? '◆' : e.sigil}</em>`;
  chron.appendChild(d); while (chron.children.length > 14) chron.firstChild.remove();
}
function setWorld(w) {
  const first = !world;
  world = w;
  if (first) { chron.innerHTML = ''; for (const e of w.chronicle.slice(-14)) addChron(e, false); $('veil').style.opacity = 0; }
}

// ---------- boucle de calcul ----------
const budgetMs = () => Math.max(3, Math.min(14, 2 + (tele.cores || 2) * 1.5));
async function runUnit(unit, verify, onDone, onProgress) {
  const gen = S.simulateUnitGen(T, unit);
  lease = { unit, agents: unit.agents, step: 0, t0: performance.now(), verify };
  let lastDec = 0, lastT = performance.now(), lastProg = 0;
  await new Promise(resolve => {
    const tickFrame = () => {
      const start = performance.now();
      let r;
      do {
        r = gen.next();
        if (r.done) break;
        lease.agents = r.value.agents; lease.step = r.value.step + 1;
      } while (performance.now() - start < budgetMs() && lease.step % 2 !== 0);
      const now = performance.now();
      if (r.value?.decisions != null && now - lastT > 400) { tele.dps = Math.round((r.value.decisions - lastDec) / ((now - lastT) / 1000)); lastDec = r.value.decisions; lastT = now; }
      if (onProgress && !r.done && now - lastProg > 400) { lastProg = now; onProgress(lease.step, lease.agents); }
      if (r.done) { onDone(r.value, performance.now() - lease.t0); resolve(); } else requestAnimationFrame(tickFrame);
    };
    requestAnimationFrame(tickFrame);
  });
}
const sleep = ms => new Promise(r => setTimeout(r, ms));

async function loopServer() {
  const A = await loadAssets(); T = S.loadTerrain(A.terre); uploadFond(A.img); LINES = A;
  let sock = null, backoff = 1000, waiting = null;
  const send = o => { if (sock?.readyState === 1) sock.send(JSON.stringify(o)); };
  const connect = () => new Promise(resolve => {
    sock = new WebSocket(location.origin.replace(/^http/, 'ws') + '/ws');
    sock.onopen = () => { backoff = 1000; send({ t: 'hello', sigil: ME }); };
    sock.onmessage = ev => {
      const m = JSON.parse(ev.data);
      switch (m.t) {
        case 'hello': online = m.online; setWorld(m.world); for (const p of m.peers) peers.set(p.sigil, { region: p.region, step: p.step, agents: [], at: Date.now() }); resolve(); break;
        case 'world': setWorld(m.world); break;
        case 'chronicle': addChron(m.entry, true); break;
        case 'market': if (world) { world.market = m.market; world.climate = m.climate; } break;
        case 'online': online = m.online; break;
        case 'lease': peers.set(m.sigil, { region: m.region, step: 0, agents: [], at: Date.now() }); break;
        case 'progress': { const pr = peers.get(m.sigil) || { region: m.region, agents: [] }; pr.region = m.region; pr.step = m.step; pr.agents = m.agents; pr.at = Date.now(); peers.set(m.sigil, pr); break; }
        case 'release': peers.delete(m.sigil); break;
        case 'unit': case 'ack': case 'nack': if (waiting) { const w = waiting; waiting = null; w(m); } break;
      }
    };
    sock.onclose = () => { lease = null; peers.clear(); if (waiting) { const w = waiting; waiting = null; w({ t: 'nack', reason: 'déconnecté' }); } setTimeout(connect, backoff); backoff = Math.min(15000, backoff * 2); };
    sock.onerror = () => {};
  });
  const ask = o => new Promise(res => { waiting = res; send(o); setTimeout(() => { if (waiting === res) { waiting = null; res({ t: 'nack', reason: 'délai' }); } }, 20000); });
  await connect();
  for (;;) {
    try {
      if (sock?.readyState !== 1) { await sleep(1000); continue; }
      const m = await ask({ t: 'lease' });
      if (m.t !== 'unit') { lease = null; await sleep(4000); continue; }
      const { unit, verify } = m;
      await runUnit(unit, verify, async (result, ms) => {
        const r = await ask({ t: 'result', result, verify, hash: S.hashResult(result), ms: Math.round(ms) });
        if (r.t === 'ack') { tele.units++; tele.ticks += STEPS; tele.decisions += result.decisions; }
      }, (step, agents) => send({ t: 'progress', region: unit.region, step, agents: agents.filter(a => a.pop > 0).map(a => [a.id, a.x, a.y, a.lin, a.pop]) }));
      lease = null;
      await sleep(900 + Math.random() * 1500);
    } catch (e) { lease = null; await sleep(5000); }
  }
}

// mode démo : le monde vit dans l'onglet, avec un passé et un indice simulés
function syntheticMarket(day) {
  const d0 = Date.UTC(2026, 0, 1), n = Math.floor((day - d0) / 86400000);
  let v = 6000, prev = 6000, seed = 0x2545F491;
  const rnd = () => { seed ^= seed << 13; seed ^= seed >>> 17; seed ^= seed << 5; return ((seed >>> 0) / 4294967296) - 0.5; };
  for (let i = 0; i <= n; i++) { prev = v; v *= 1 + rnd() * 0.02 + 0.0003; }
  return { date: new Date(day).toISOString().slice(0, 10), close: Math.round(v * 100) / 100, prev, change: ((v - prev) / prev) * 100, source: 'synthétique' };
}
async function loopDemo() {
  const A = await loadAssets(); T = S.loadTerrain(A.terre); uploadFond(A.img); LINES = A;
  const w = S.World.create(20261007, T);
  const t = Date.now() - 37 * 86400000, gap = 3 * 3600000;
  w.s.created = t; w.s.chronicle[0].t = t;
  const ghosts = ['K7QD-3MZA', 'B2VX-9HLP', 'ZQ0F-P1NR', 'H8WT-4ECS'];
  for (let i = 0; i < 96; i++) {
    const g = ghosts[i % 4], at = t + (i < 24 ? i * gap : 19 * 86400000 + i * gap);
    w.setMarket(syntheticMarket(at));
    const u = w.lease(g, at); if (u) w.integrate(S.simulateUnit(w.T, u), g, { now: at });
  }
  for (const c of w.s.chronicle) c.t = Math.min(c.t, Date.now() - 60000);
  w.setMarket(syntheticMarket(Date.now()));
  online = 1 + Math.floor(Math.random() * 3);
  setWorld(w.snapshot(online));
  for (;;) {
    const unit = w.lease(ME);
    await runUnit(unit, false, (result) => { const r = w.integrate(result, ME); tele.units++; tele.ticks += STEPS; tele.decisions += result.decisions; setWorld(w.snapshot(online)); for (const e of r.entries) addChron(e, true); });
    lease = null;
    await sleep(900 + Math.random() * 1500);
  }
}
(DEMO ? loopDemo : loopServer)();
</script>
